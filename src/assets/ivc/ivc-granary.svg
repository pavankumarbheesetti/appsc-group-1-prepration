<?xml version="1.0" encoding="UTF-8"?>
<!--
  ivc-granary.svg — original schematic of the "Great Granary" (Mohenjo-daro /
  Harappa type). Intent: convey the diagnostic features asked in exams — a large
  brick platform of parallel storage blocks separated by AIR-DUCTS (ventilation
  passages to keep grain dry) and external LOADING BAYS/ramps where carts backed
  up to receive or deposit grain. Self-contained panel + dark ink; adapts to OS
  dark mode via prefers-color-scheme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img"
     aria-label="Schematic of the Harappan Great Granary showing storage blocks, ventilation air-ducts and loading bays">
  <style>
    .panel { fill: #f7f3ea; stroke: #d8cdb5; }
    .ink   { fill: #2b2b2b; }
    .muted { fill: #6b7280; }
    .base  { fill: #e7d3ad; stroke: #b8934f; }
    .blk   { fill: #d9a441; stroke: #9a6f1f; }
    .duct  { fill: #ece3cf; stroke: #c9b78f; }
    .bay   { fill: #b45309; stroke: #7c3f06; }
    .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#ah); }
    text   { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #1f2530; stroke: #3a4353; }
      .ink   { fill: #f3f4f6; }
      .muted { fill: #aab2bd; }
      .base  { fill: #3a3320; stroke: #7c6a3a; }
      .duct  { fill: #2b3342; stroke: #43506a; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="panel" x="4" y="4" width="812" height="492" rx="16"/>
  <text class="ink" x="28" y="42" font-size="24" font-weight="700">The Great Granary</text>
  <text class="muted" x="28" y="66" font-size="14">Parallel storage blocks · air-ducts between them for ventilation · external loading bays</text>

  <!-- Brick base platform -->
  <rect class="base" x="120" y="150" width="500" height="250" rx="6"/>

  <!-- Storage blocks (6) separated by air-duct gaps -->
  <g>
    <rect class="blk" x="150" y="176" width="60" height="198" rx="3"/>
    <rect class="duct" x="214" y="176" width="18" height="198" rx="2"/>
    <rect class="blk" x="236" y="176" width="60" height="198" rx="3"/>
    <rect class="duct" x="300" y="176" width="18" height="198" rx="2"/>
    <rect class="blk" x="322" y="176" width="60" height="198" rx="3"/>
    <rect class="duct" x="386" y="176" width="18" height="198" rx="2"/>
    <rect class="blk" x="408" y="176" width="60" height="198" rx="3"/>
    <rect class="duct" x="472" y="176" width="18" height="198" rx="2"/>
    <rect class="blk" x="494" y="176" width="60" height="198" rx="3"/>
    <rect class="duct" x="558" y="176" width="18" height="198" rx="2"/>
    <rect class="blk" x="580" y="176" width="28" height="198" rx="3"/>
  </g>

  <!-- Loading bays / ramps on the south edge -->
  <rect class="bay" x="180" y="400" width="90" height="26" rx="3"/>
  <rect class="bay" x="470" y="400" width="90" height="26" rx="3"/>
  <text class="ink" x="225" y="446" font-size="13" font-weight="700" text-anchor="middle">Loading bay</text>
  <text class="ink" x="515" y="446" font-size="13" font-weight="700" text-anchor="middle">Loading bay</text>

  <!-- Callouts -->
  <text class="ink" x="223" y="140" font-size="13" font-weight="700" text-anchor="middle">air-duct ↓</text>
  <line stroke="#9aa0a6" x1="223" y1="146" x2="223" y2="176"/>
  <!-- Airflow arrows through a duct -->
  <path class="arrow" d="M223 386 L223 176"/>
  <text class="muted" x="700" y="290" font-size="13" text-anchor="middle">↑ ventilation</text>
  <text class="muted" x="700" y="310" font-size="13" text-anchor="middle">keeps grain dry</text>
</svg>
