<?xml version="1.0" encoding="UTF-8"?>
<!-- econ-planning-timeline.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Planning in India timeline</title>
  <desc id="d">Vertical timeline: 1950 Planning Commission, 1951-56 First Plan (Harrod-Domar), 1956 Second Plan (Mahalanobis), 1991 LPG reforms, 2015 NITI Aayog replaces the Planning Commission.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="412" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Planning in India — Commission to NITI Aayog</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Timeline of key milestones</text><path class="lead" d="M70 120 L70 380" stroke-width="2"/><circle class="teal" cx="70" cy="140" r="10"/><text class="accent" x="48" y="145" font-size="14" font-weight="700" text-anchor="end">1950</text><text class="ink" x="94" y="145" font-size="13.5" text-anchor="start">Planning Commission set up (advisory, non-statutory)</text><circle class="teal" cx="70" cy="192" r="10"/><text class="accent" x="48" y="197" font-size="14" font-weight="700" text-anchor="end">1951–56</text><text class="ink" x="94" y="197" font-size="13.5" text-anchor="start">First Five-Year Plan (Harrod-Domar; agriculture focus)</text><circle class="teal" cx="70" cy="244" r="10"/><text class="accent" x="48" y="249" font-size="14" font-weight="700" text-anchor="end">1956</text><text class="ink" x="94" y="249" font-size="13.5" text-anchor="start">Second Plan (Mahalanobis; heavy industry)</text><circle class="teal" cx="70" cy="296" r="10"/><text class="accent" x="48" y="301" font-size="14" font-weight="700" text-anchor="end">1991</text><text class="ink" x="94" y="301" font-size="13.5" text-anchor="start">LPG reforms — liberalisation, privatisation, globalisation</text><circle class="teal" cx="70" cy="348" r="10"/><text class="accent" x="48" y="353" font-size="14" font-weight="700" text-anchor="end">2015</text><text class="ink" x="94" y="353" font-size="13.5" text-anchor="start">NITI Aayog replaces the Planning Commission (think-tank; cooperative federalism)</text>
</svg>
