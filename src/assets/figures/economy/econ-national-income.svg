<?xml version="1.0" encoding="UTF-8"?>
<!-- econ-national-income.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">National income aggregates</title>
  <desc id="d">Ladder relating GDP, GNP (GDP + net factor income from abroad), NNP (GNP - depreciation), NNP at factor cost (National Income), and per capita income.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">National income aggregates</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">How the measures relate (schematic ladder)</text><rect class="box" x="28" y="96" width="764" height="62" rx="10"/><text class="ink" x="44" y="123" font-size="16" font-weight="700" text-anchor="start">GDP</text><text class="muted" x="44" y="145" font-size="12.5" text-anchor="start">Gross Domestic Product — value of output within the country</text><rect class="box2" x="28" y="166" width="764" height="62" rx="10"/><text class="ink" x="44" y="193" font-size="16" font-weight="700" text-anchor="start">GNP = GDP + NFIA</text><text class="muted" x="44" y="215" font-size="12.5" text-anchor="start">Net Factor Income from Abroad added</text><rect class="box3" x="28" y="236" width="764" height="62" rx="10"/><text class="ink" x="44" y="263" font-size="16" font-weight="700" text-anchor="start">NNP = GNP − Depreciation</text><text class="muted" x="44" y="285" font-size="12.5" text-anchor="start">'National Income' at market prices</text><rect class="box2" x="28" y="306" width="764" height="62" rx="10"/><text class="ink" x="44" y="333" font-size="16" font-weight="700" text-anchor="start">NNP at factor cost</text><text class="muted" x="44" y="355" font-size="12.5" text-anchor="start">= NNP(MP) − indirect taxes + subsidies → true National Income</text><rect class="box" x="28" y="376" width="764" height="62" rx="10"/><text class="ink" x="44" y="403" font-size="16" font-weight="700" text-anchor="start">Per capita income</text><text class="muted" x="44" y="425" font-size="12.5" text-anchor="start">= National Income ÷ population</text><text class="muted" x="28" y="456" font-size="13" text-anchor="start">NFIA = income Indians earn abroad − income foreigners earn in India.</text>
</svg>
