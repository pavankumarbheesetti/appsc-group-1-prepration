<?xml version="1.0" encoding="UTF-8"?>
<!-- econ-banking-structure.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="t d">
  <title id="t">RBI and banking structure</title>
  <desc id="d">RBI (1935) at top; its monetary tools (repo, CRR, SLR, OMO, MSF, LAF); and the scheduled-bank pyramid (public, private, RRBs, cooperative/small-finance/payments banks). MPC targets 4% inflation.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="472" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">RBI &amp; the banking structure</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Regulator, tools, and the bank pyramid</text><rect class="box3" x="260" y="92" width="300" height="56" rx="12"/><text class="ink" x="410" y="126" font-size="15" font-weight="700" text-anchor="middle">Reserve Bank of India (1935)</text><rect class="box2" x="28" y="168" width="764" height="120" rx="12"/><text class="ink" x="44" y="194" font-size="15" font-weight="700" text-anchor="start">Monetary policy tools</text><text class="muted" x="44" y="226" font-size="13" text-anchor="start">• Repo / Reverse Repo rate</text><text class="muted" x="294" y="226" font-size="13" text-anchor="start">• CRR (Cash Reserve Ratio)</text><text class="muted" x="544" y="226" font-size="13" text-anchor="start">• SLR (Statutory Liquidity Ratio)</text><text class="muted" x="44" y="256" font-size="13" text-anchor="start">• OMO (Open Market Operations)</text><text class="muted" x="294" y="256" font-size="13" text-anchor="start">• MSF / Bank Rate</text><text class="muted" x="544" y="256" font-size="13" text-anchor="start">• LAF corridor</text><rect class="box" x="28" y="308" width="764" height="140" rx="12"/><text class="ink" x="44" y="334" font-size="15" font-weight="700" text-anchor="start">Scheduled banks</text><text class="muted" x="44" y="362" font-size="13" text-anchor="start">– Public sector (SBI + nationalised)</text><text class="muted" x="44" y="384" font-size="13" text-anchor="start">– Private sector banks</text><text class="muted" x="44" y="406" font-size="13" text-anchor="start">– Regional Rural Banks (RRBs)</text><text class="muted" x="44" y="428" font-size="13" text-anchor="start">– Cooperative banks · Small Finance · Payments banks</text><text class="muted" x="28" y="466" font-size="12.5" text-anchor="start">RBI's chief aim: inflation targeting (4% ± 2%) via the Monetary Policy Committee (MPC).</text>
</svg>
