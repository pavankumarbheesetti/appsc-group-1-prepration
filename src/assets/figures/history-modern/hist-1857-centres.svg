<?xml version="1.0" encoding="UTF-8"?>
<!-- hist-1857-centres.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
  <title id="t">Revolt of 1857 centres and leaders</title>
  <desc id="d">Schematic map of 1857 revolt centres: Delhi (Bahadur Shah II), Kanpur (Nana Saheb/Tantia Tope), Lucknow (Begum Hazrat Mahal), Jhansi (Rani Lakshmibai), Bareilly (Khan Bahadur Khan), Arrah (Kunwar Singh).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="492" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Revolt of 1857 — major centres &amp; leaders</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Schematic north-Indian map (not to scale)</text><path class="land" d="M170 110 C 360 90, 560 110, 640 200 C 690 300, 620 420, 460 450 C 320 470, 210 420, 190 320 C 170 240, 150 160, 170 110 Z"/><circle class="accent" cx="300" cy="170" r="7"/><text class="ink" x="312" y="168" font-size="13.5" font-weight="700" text-anchor="start">Delhi</text><text class="muted" x="312" y="185" font-size="11.5" text-anchor="start">Bahadur Shah II</text><circle class="accent" cx="420" cy="200" r="7"/><text class="ink" x="432" y="198" font-size="13.5" font-weight="700" text-anchor="start">Kanpur</text><text class="muted" x="432" y="215" font-size="11.5" text-anchor="start">Nana Saheb / Tantia Tope</text><circle class="accent" cx="470" cy="240" r="7"/><text class="ink" x="482" y="238" font-size="13.5" font-weight="700" text-anchor="start">Lucknow</text><text class="muted" x="482" y="255" font-size="11.5" text-anchor="start">Begum Hazrat Mahal</text><circle class="accent" cx="400" cy="300" r="7"/><text class="ink" x="412" y="298" font-size="13.5" font-weight="700" text-anchor="start">Jhansi</text><text class="muted" x="412" y="315" font-size="11.5" text-anchor="start">Rani Lakshmibai</text><circle class="accent" cx="250" cy="250" r="7"/><text class="ink" x="262" y="248" font-size="13.5" font-weight="700" text-anchor="start">Bareilly</text><text class="muted" x="262" y="265" font-size="11.5" text-anchor="start">Khan Bahadur Khan</text><circle class="accent" cx="500" cy="330" r="7"/><text class="ink" x="512" y="328" font-size="13.5" font-weight="700" text-anchor="start">Arrah (Bihar)</text><text class="muted" x="512" y="345" font-size="11.5" text-anchor="start">Kunwar Singh</text><text class="muted" x="28" y="470" font-size="12.5" text-anchor="start">Trigger: greased cartridges (Mangal Pandey, Barrackpore, 29 Mar 1857). Suppressed 1858; Crown rule begins.</text>
</svg>
