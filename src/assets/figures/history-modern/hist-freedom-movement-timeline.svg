<?xml version="1.0" encoding="UTF-8"?>
<!-- hist-freedom-movement-timeline.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 484" role="img" aria-labelledby="t d">
  <title id="t">Freedom movement timeline</title>
  <desc id="d">Timeline: INC 1885, Bengal Partition/Swadeshi 1905, Rowlatt &amp; Jallianwala Bagh 1919, Non-Cooperation 1920, Civil Disobedience/Dandi 1930, Quit India 1942, Independence 1947.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="476" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Indian freedom movement — key milestones</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Gandhian era onwards</text><path class="lead" d="M90 108 L90 452" stroke-width="2"/><circle class="teal" cx="90" cy="130" r="9"/><text class="accent" x="70" y="135" font-size="13" font-weight="700" text-anchor="end">1885</text><text class="ink" x="112" y="135" font-size="13.5" text-anchor="start">Indian National Congress founded</text><circle class="teal" cx="90" cy="182" r="9"/><text class="accent" x="70" y="187" font-size="13" font-weight="700" text-anchor="end">1905</text><text class="ink" x="112" y="187" font-size="13.5" text-anchor="start">Partition of Bengal → Swadeshi movement</text><circle class="teal" cx="90" cy="234" r="9"/><text class="accent" x="70" y="239" font-size="13" font-weight="700" text-anchor="end">1919</text><text class="ink" x="112" y="239" font-size="13.5" text-anchor="start">Rowlatt Act; Jallianwala Bagh massacre</text><circle class="teal" cx="90" cy="286" r="9"/><text class="accent" x="70" y="291" font-size="13" font-weight="700" text-anchor="end">1920</text><text class="ink" x="112" y="291" font-size="13.5" text-anchor="start">Non-Cooperation Movement (Gandhi)</text><circle class="teal" cx="90" cy="338" r="9"/><text class="accent" x="70" y="343" font-size="13" font-weight="700" text-anchor="end">1930</text><text class="ink" x="112" y="343" font-size="13.5" text-anchor="start">Civil Disobedience — Dandi Salt March</text><circle class="teal" cx="90" cy="390" r="9"/><text class="accent" x="70" y="395" font-size="13" font-weight="700" text-anchor="end">1942</text><text class="ink" x="112" y="395" font-size="13.5" text-anchor="start">Quit India Movement</text><circle class="teal" cx="90" cy="442" r="9"/><text class="accent" x="70" y="447" font-size="13" font-weight="700" text-anchor="end">1947</text><text class="ink" x="112" y="447" font-size="13.5" text-anchor="start">Independence &amp; Partition</text>
</svg>
