<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-india-national-parks.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d">
  <title id="t">Faunal strongholds of India</title>
  <desc id="d">Animal to habitat pairs: Asiatic Lion (Gir), One-horned Rhino (Kaziranga), Asiatic Wild Ass (Little Rann of Kutch), Hangul (Dachigam), Great Indian Bustard (Desert NP &amp; Rollapadu), most tigers (Madhya Pradesh).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="432" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Signature faunal strongholds of India</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Animal → its flagship habitat</text><rect class="box" x="28" y="96" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="119" r="7"/><text class="ink" x="72" y="124" font-size="15" font-weight="700" text-anchor="start">Asiatic Lion</text><text class="teal" x="770" y="124" font-size="14" font-weight="600" text-anchor="end">Gir NP, Gujarat</text><rect class="box" x="28" y="150" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="173" r="7"/><text class="ink" x="72" y="178" font-size="15" font-weight="700" text-anchor="start">One-horned Rhino</text><text class="teal" x="770" y="178" font-size="14" font-weight="600" text-anchor="end">Kaziranga NP, Assam</text><rect class="box" x="28" y="204" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="227" r="7"/><text class="ink" x="72" y="232" font-size="15" font-weight="700" text-anchor="start">Asiatic Wild Ass</text><text class="teal" x="770" y="232" font-size="14" font-weight="600" text-anchor="end">Little Rann of Kutch, Gujarat</text><rect class="box" x="28" y="258" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="281" r="7"/><text class="ink" x="72" y="286" font-size="15" font-weight="700" text-anchor="start">Hangul (Kashmir stag)</text><text class="teal" x="770" y="286" font-size="14" font-weight="600" text-anchor="end">Dachigam NP, J&amp;K</text><rect class="box" x="28" y="312" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="335" r="7"/><text class="ink" x="72" y="340" font-size="15" font-weight="700" text-anchor="start">Great Indian Bustard</text><text class="teal" x="770" y="340" font-size="14" font-weight="600" text-anchor="end">Desert NP (Raj.) &amp; Rollapadu (AP)</text><rect class="box" x="28" y="366" width="764" height="46" rx="9"/><circle class="accent" cx="52" cy="389" r="7"/><text class="ink" x="72" y="394" font-size="15" font-weight="700" text-anchor="start">Tiger (most)</text><text class="teal" x="770" y="394" font-size="14" font-weight="600" text-anchor="end">Madhya Pradesh — 'Tiger State'</text><text class="muted" x="28" y="420" font-size="13" text-anchor="start">First NP: Jim Corbett (1936). Largest NP: Hemis (Ladakh). Project Tiger: 1973.</text>
</svg>
