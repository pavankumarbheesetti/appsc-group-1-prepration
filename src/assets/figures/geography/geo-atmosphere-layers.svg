<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-atmosphere-layers.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
  <title id="t">Layers of the atmosphere</title>
  <desc id="d">Five bands from ground up: troposphere (0-12 km, weather), stratosphere (12-50 km, ozone), mesosphere (50-80 km, meteors), thermosphere (80-700 km, ionosphere/auroras), exosphere (&gt;700 km).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="492" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Layers of the atmosphere</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Ground → space (schematic; approx. altitudes)</text><rect class="box" x="28" y="92" width="764" height="72" rx="10"/><text class="ink" x="44" y="122" font-size="16" font-weight="700" text-anchor="start">Exosphere</text><text class="muted" x="44" y="146" font-size="13" text-anchor="start">&gt;700 km — merges into space</text><rect class="box2" x="28" y="172" width="764" height="72" rx="10"/><text class="ink" x="44" y="202" font-size="16" font-weight="700" text-anchor="start">Thermosphere</text><text class="muted" x="44" y="226" font-size="13" text-anchor="start">80–700 km — ionosphere, auroras, temp ↑</text><rect class="box3" x="28" y="252" width="764" height="72" rx="10"/><text class="ink" x="44" y="282" font-size="16" font-weight="700" text-anchor="start">Mesosphere</text><text class="muted" x="44" y="306" font-size="13" text-anchor="start">50–80 km — coldest; meteors burn up</text><rect class="box2" x="28" y="332" width="764" height="72" rx="10"/><text class="ink" x="44" y="362" font-size="16" font-weight="700" text-anchor="start">Stratosphere</text><text class="muted" x="44" y="386" font-size="13" text-anchor="start">12–50 km — OZONE layer; jets fly here; temp ↑</text><rect class="box3" x="28" y="412" width="764" height="72" rx="10"/><text class="ink" x="44" y="442" font-size="16" font-weight="700" text-anchor="start">Troposphere</text><text class="muted" x="44" y="466" font-size="13" text-anchor="start">0–12 km — weather, ~75% of mass; temp ↓ with height</text>
</svg>
