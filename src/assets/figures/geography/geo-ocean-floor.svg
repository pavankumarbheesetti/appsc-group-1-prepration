<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-ocean-floor.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d">
  <title id="t">Ocean floor relief</title>
  <desc id="d">Profile of ocean-floor divisions: continental shelf, continental slope, mid-oceanic ridge, abyssal plain, and deep-sea trenches.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="422" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Relief of the ocean floor</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Major divisions from coast to deep (schematic profile)</text><path class="land" d="M40 140 L200 150 L240 260 L420 275 L470 200 L560 210 L640 360 L780 365 L780 400 L40 400 Z" opacity="0.9"/><text class="ink" x="120" y="135" font-size="13" font-weight="700" text-anchor="middle">Continental Shelf</text><circle class="teal" cx="120" cy="143" r="4"/><text class="ink" x="300" y="250" font-size="13" font-weight="700" text-anchor="middle">Continental Slope</text><circle class="teal" cx="300" cy="258" r="4"/><text class="ink" x="470" y="185" font-size="13" font-weight="700" text-anchor="middle">Mid-Oceanic Ridge</text><circle class="teal" cx="470" cy="193" r="4"/><text class="ink" x="560" y="340" font-size="13" font-weight="700" text-anchor="middle">Abyssal Plain</text><circle class="teal" cx="560" cy="348" r="4"/><text class="ink" x="700" y="350" font-size="13" font-weight="700" text-anchor="middle">Ocean Deep / Trench</text><circle class="teal" cx="700" cy="358" r="4"/><text class="muted" x="28" y="424" font-size="12.5" text-anchor="start">Shelf: richest fishing/oil. Trenches (e.g. Mariana) are the deepest points.</text>
</svg>
