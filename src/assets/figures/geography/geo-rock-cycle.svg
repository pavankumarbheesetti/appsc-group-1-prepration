<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-rock-cycle.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="t d">
  <title id="t">The rock cycle</title>
  <desc id="d">Rock cycle among igneous (cooled magma), sedimentary (compacted sediments), and metamorphic (heat and pressure) rocks, linked by weathering, melting and uplift.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="452" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">The rock cycle</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Three rock types and their transformations</text><rect class="box2" x="310" y="96" width="200" height="72" rx="12"/><text class="ink" x="410" y="124" font-size="16" font-weight="700" text-anchor="middle">Igneous</text><text class="muted" x="410" y="148" font-size="12" text-anchor="middle">cools from magma/lava</text><rect class="box3" x="520" y="286" width="200" height="72" rx="12"/><text class="ink" x="620" y="314" font-size="16" font-weight="700" text-anchor="middle">Sedimentary</text><text class="muted" x="620" y="338" font-size="12" text-anchor="middle">compaction of sediments</text><rect class="box" x="100" y="286" width="200" height="72" rx="12"/><text class="ink" x="200" y="314" font-size="16" font-weight="700" text-anchor="middle">Metamorphic</text><text class="muted" x="200" y="338" font-size="12" text-anchor="middle">heat + pressure</text><path class="lead" d="M470 150 C 560 200, 600 250, 610 285" marker-end=""/><path class="lead" d="M520 340 C 430 360, 330 360, 300 345"/><path class="lead" d="M210 285 C 230 220, 300 175, 350 150"/><text class="muted" x="410" y="250" font-size="12" text-anchor="middle">weathering / erosion → melting → uplift</text><text class="muted" x="28" y="440" font-size="12" text-anchor="start">Magma cools → igneous; weathered debris cements → sedimentary; heat &amp; pressure alter any rock → metamorphic.</text>
</svg>
