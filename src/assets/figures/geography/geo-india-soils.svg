<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-india-soils.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Major soils of India</title>
  <desc id="d">Five bands: Alluvial (plains/deltas, most extensive ~43%), Black/Regur (Deccan Trap, cotton), Red (crystalline areas), Laterite (leached uplands), Desert (arid Rajasthan/Gujarat).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Major soils of India</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Type · where · note (schematic)</text><rect class="box3" x="28" y="92" width="764" height="62" rx="10"/><text class="ink" x="44" y="118" font-size="16" font-weight="700" text-anchor="start">Alluvial</text><text class="muted" x="44" y="140" font-size="13" text-anchor="start">Indo-Gangetic-Brahmaputra plains, deltas</text><text class="muted" x="430" y="130" font-size="13" text-anchor="start">Most extensive (~43%); wheat, rice, cane</text><rect class="box" x="28" y="162" width="764" height="62" rx="10"/><text class="ink" x="44" y="188" font-size="16" font-weight="700" text-anchor="start">Black (Regur)</text><text class="muted" x="44" y="210" font-size="13" text-anchor="start">Deccan Trap (basalt)</text><text class="muted" x="430" y="200" font-size="13" text-anchor="start">Cotton; moisture-retentive, self-ploughing</text><rect class="box2" x="28" y="232" width="764" height="62" rx="10"/><text class="ink" x="44" y="258" font-size="16" font-weight="700" text-anchor="start">Red</text><text class="muted" x="44" y="280" font-size="13" text-anchor="start">Low-rainfall crystalline areas</text><text class="muted" x="430" y="270" font-size="13" text-anchor="start">Ferric-oxide red; millets, pulses</text><rect class="box2" x="28" y="302" width="764" height="62" rx="10"/><text class="ink" x="44" y="328" font-size="16" font-weight="700" text-anchor="start">Laterite</text><text class="muted" x="44" y="350" font-size="13" text-anchor="start">High heat + heavy rain uplands</text><text class="muted" x="430" y="340" font-size="13" text-anchor="start">Leached, low humus; cashew, tea, ragi</text><rect class="box" x="28" y="372" width="764" height="62" rx="10"/><text class="ink" x="44" y="398" font-size="16" font-weight="700" text-anchor="start">Desert (arid)</text><text class="muted" x="44" y="420" font-size="13" text-anchor="start">Rajasthan / Gujarat</text><text class="muted" x="430" y="410" font-size="13" text-anchor="start">Saline, sandy; bajra, barley w/ irrigation</text>
</svg>
