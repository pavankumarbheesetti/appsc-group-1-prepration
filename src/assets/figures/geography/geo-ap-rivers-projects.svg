<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-ap-rivers-projects.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="t d">
  <title id="t">Andhra Pradesh rivers and irrigation projects</title>
  <desc id="d">Schematic of AP rivers draining east into the Bay of Bengal: Vamsadhara/Nagavali (shared with Odisha), Godavari (Polavaram National Project), Krishna (Nagarjuna Sagar, Srisailam), Pennar (Somasila); plus Handri-Neeva lifting Krishna water to Rayalaseema.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="472" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Andhra Pradesh — rivers &amp; major irrigation projects</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Schematic; all major rivers drain east into the Bay of Bengal</text><path class="river" d="M700 90 C 740 200, 740 320, 700 440" stroke="#0ea5e9" stroke-width="4"/><text class="muted" x="770" y="270" font-size="13" text-anchor="middle">Bay of Bengal</text><path class="river" d="M60 130 C 300 116, 520 144, 700 130"/><text class="ink" x="60" y="118" font-size="14" font-weight="700" text-anchor="start">Vamsadhara / Nagavali</text><text class="muted" x="300" y="156" font-size="12.5" text-anchor="start">shared with Odisha (north-coastal)</text><path class="river" d="M60 210 C 300 196, 520 224, 700 210"/><text class="ink" x="60" y="198" font-size="14" font-weight="700" text-anchor="start">Godavari</text><text class="muted" x="300" y="236" font-size="12.5" text-anchor="start">‘Dakshina Ganga’ — Polavaram (National Project)</text><path class="river" d="M60 300 C 300 286, 520 314, 700 300"/><text class="ink" x="60" y="288" font-size="14" font-weight="700" text-anchor="start">Krishna</text><text class="muted" x="300" y="326" font-size="12.5" text-anchor="start">Nagarjuna Sagar · Srisailam</text><path class="river" d="M60 380 C 300 366, 520 394, 700 380"/><text class="ink" x="60" y="368" font-size="14" font-weight="700" text-anchor="start">Pennar (Penna)</text><text class="muted" x="300" y="406" font-size="12.5" text-anchor="start">Somasila</text><rect class="box2" x="60" y="410" width="700" height="50" rx="10"/><text class="ink" x="76" y="440" font-size="13.5" font-weight="600" text-anchor="start">Handri-Neeva Sujala Sravanthi: lifts Krishna water to drought-prone Rayalaseema.</text>
</svg>
