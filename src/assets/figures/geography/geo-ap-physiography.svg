<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-ap-physiography.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Andhra Pradesh physiographic divisions</title>
  <desc id="d">Three west-to-east columns: Rayalaseema plateau (semi-arid interior), Eastern Ghats (discontinuous hills), Coastal plains (Godavari-Krishna deltas). Arma Konda ~1,690 m is the tallest Eastern Ghats peak.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="412" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Andhra Pradesh — three physiographic divisions</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">West → East transect (schematic)</text><rect class="box2" x="40" y="120" width="240" height="210" rx="12"/><text class="ink" x="160.0" y="152" font-size="15" font-weight="700" text-anchor="middle">Rayalaseema Plateau</text><text class="muted" x="160.0" y="186" font-size="12.5" text-anchor="middle">Semi-arid Deccan interior</text><rect class="box3" x="290" y="120" width="240" height="210" rx="12"/><text class="ink" x="410.0" y="152" font-size="15" font-weight="700" text-anchor="middle">Eastern Ghats</text><text class="muted" x="410.0" y="186" font-size="12.5" text-anchor="middle">Discontinuous hills:</text><text class="muted" x="410.0" y="204" font-size="12.5" text-anchor="middle">Nallamala, Papikonda,</text><text class="muted" x="410.0" y="222" font-size="12.5" text-anchor="middle">Seshachalam, Erramala</text><rect class="box" x="540" y="120" width="240" height="210" rx="12"/><text class="ink" x="660.0" y="152" font-size="15" font-weight="700" text-anchor="middle">Coastal Plains</text><text class="muted" x="660.0" y="186" font-size="12.5" text-anchor="middle">Fertile Godavari–Krishna</text><text class="muted" x="660.0" y="204" font-size="12.5" text-anchor="middle">deltas along the Bay of</text><text class="muted" x="660.0" y="222" font-size="12.5" text-anchor="middle">Bengal</text><text class="muted" x="28" y="366" font-size="13" text-anchor="start">Arma Konda (~1,680–1,690 m, Alluri Sitharama Raju dist.) — tallest peak of the Eastern Ghats.</text>
</svg>
