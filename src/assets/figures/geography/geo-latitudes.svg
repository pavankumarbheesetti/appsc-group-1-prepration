<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-latitudes.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Important latitudes</title>
  <desc id="d">Globe schematic marking the Equator (0 degrees), Tropic of Cancer (23.5 N), Tropic of Capricorn (23.5 S), Arctic Circle (66.5 N) and Antarctic Circle (66.5 S).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Important latitudes (parallels)</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Key lines on the globe</text><circle cx="250" cy="270" r="150" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="100" y1="270" x2="400" y2="270" stroke="#0f766e" stroke-width="2" opacity="0.8"/><line x1="113" y1="209" x2="387" y2="209" stroke="#0f766e" stroke-width="2" opacity="0.8"/><line x1="113" y1="331" x2="387" y2="331" stroke="#0f766e" stroke-width="2" opacity="0.8"/><line x1="148" y1="160" x2="352" y2="160" stroke="#0f766e" stroke-width="2" opacity="0.8"/><line x1="148" y1="380" x2="352" y2="380" stroke="#0f766e" stroke-width="2" opacity="0.8"/><rect class="box" x="470" y="108" width="322" height="40" rx="9"/><text class="ink" x="486" y="134" font-size="13.5" font-weight="600" text-anchor="start">Equator (0°)</text><rect class="box" x="470" y="160" width="322" height="40" rx="9"/><text class="ink" x="486" y="186" font-size="13.5" font-weight="600" text-anchor="start">Tropic of Cancer (23½°N)</text><rect class="box" x="470" y="212" width="322" height="40" rx="9"/><text class="ink" x="486" y="238" font-size="13.5" font-weight="600" text-anchor="start">Tropic of Capricorn (23½°S)</text><rect class="box" x="470" y="264" width="322" height="40" rx="9"/><text class="ink" x="486" y="290" font-size="13.5" font-weight="600" text-anchor="start">Arctic Circle (66½°N)</text><rect class="box" x="470" y="316" width="322" height="40" rx="9"/><text class="ink" x="486" y="342" font-size="13.5" font-weight="600" text-anchor="start">Antarctic Circle (66½°S)</text><text class="muted" x="28" y="452" font-size="12.5" text-anchor="start">The Tropic of Cancer passes through 8 Indian states; sun is overhead between the tropics.</text>
</svg>
