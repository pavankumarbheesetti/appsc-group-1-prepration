<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-earth-layers.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Layered interior of the Earth</title>
  <desc id="d">Concentric circles showing Earth's layers from outside in: crust (5-70 km), mantle (silicate), liquid outer core (Fe-Ni), solid inner core; Moho and Gutenberg discontinuities noted.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Interior of the Earth — layered structure</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Concentric layers (schematic, not to scale)</text><circle cx="300" cy="280" r="170" fill="#2563eb" opacity="0.85"/><circle cx="300" cy="280" r="135" fill="#0f766e" opacity="0.85"/><circle cx="300" cy="280" r="95" fill="#b45309" opacity="0.85"/><circle cx="300" cy="280" r="48" fill="#7c2d12" opacity="0.85"/><rect x="540" y="126" width="16" height="16" fill="#2563eb"/><text class="ink" x="566" y="140" font-size="16" font-weight="700" text-anchor="start">Crust</text><text class="muted" x="566" y="162" font-size="13" text-anchor="start">thin: 5–70 km</text><rect x="540" y="192" width="16" height="16" fill="#0f766e"/><text class="ink" x="566" y="206" font-size="16" font-weight="700" text-anchor="start">Mantle</text><text class="muted" x="566" y="228" font-size="13" text-anchor="start">silicate, convecting</text><rect x="540" y="258" width="16" height="16" fill="#b45309"/><text class="ink" x="566" y="272" font-size="16" font-weight="700" text-anchor="start">Outer core</text><text class="muted" x="566" y="294" font-size="13" text-anchor="start">liquid Fe–Ni</text><rect x="540" y="324" width="16" height="16" fill="#7c2d12"/><text class="ink" x="566" y="338" font-size="16" font-weight="700" text-anchor="start">Inner core</text><text class="muted" x="566" y="360" font-size="13" text-anchor="start">solid Fe–Ni</text><text class="muted" x="28" y="452" font-size="13" text-anchor="start">Discontinuities: Moho (crust–mantle), Gutenberg (mantle–core).</text>
</svg>
