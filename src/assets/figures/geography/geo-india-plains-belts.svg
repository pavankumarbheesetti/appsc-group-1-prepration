<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-india-plains-belts.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Northern Plains relief belts</title>
  <desc id="d">Four columns north to south: Bhabar (pebbly, streams vanish), Terai (marshy re-emergence), Bhangar (older alluvium), Khadar (young fertile floodplain).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="412" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Northern Plains — relief belts (north → south)</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Sequence a river crosses from the hills to the floodplain</text><rect class="box" x="40" y="120" width="176" height="200" rx="10"/><text class="ink" x="128.0" y="150" font-size="16" font-weight="700" text-anchor="middle">Bhabar</text><text class="muted" x="128.0" y="180" font-size="12" text-anchor="middle">Narrow pebbly belt;</text><text class="muted" x="128.0" y="198" font-size="12" text-anchor="middle">streams disappear</text><text class="muted" x="128.0" y="216" font-size="12" text-anchor="middle">underground</text><rect class="box3" x="228" y="120" width="176" height="200" rx="10"/><text class="ink" x="316.0" y="150" font-size="16" font-weight="700" text-anchor="middle">Terai</text><text class="muted" x="316.0" y="180" font-size="12" text-anchor="middle">Marshy re-emergence</text><text class="muted" x="316.0" y="198" font-size="12" text-anchor="middle">belt; springs resurface</text><rect class="box2" x="416" y="120" width="176" height="200" rx="10"/><text class="ink" x="504.0" y="150" font-size="16" font-weight="700" text-anchor="middle">Bhangar</text><text class="muted" x="504.0" y="180" font-size="12" text-anchor="middle">Older alluvium; kankar</text><text class="muted" x="504.0" y="198" font-size="12" text-anchor="middle">(lime) nodules</text><rect class="box2" x="604" y="120" width="176" height="200" rx="10"/><text class="ink" x="692.0" y="150" font-size="16" font-weight="700" text-anchor="middle">Khadar</text><text class="muted" x="692.0" y="180" font-size="12" text-anchor="middle">Younger, annually</text><text class="muted" x="692.0" y="198" font-size="12" text-anchor="middle">renewed floodplain —</text><text class="muted" x="692.0" y="216" font-size="12" text-anchor="middle">most fertile</text><path class="river" d="M40 110 L792 110"/><text class="muted" x="40" y="100" font-size="12" text-anchor="start">flow direction →</text><text class="muted" x="28" y="360" font-size="13" text-anchor="start">Mnemonic 'B-T-B-K': Bhabar → Terai → Bhangar → Khadar.</text>
</svg>
