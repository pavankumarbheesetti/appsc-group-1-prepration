<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-india-drainage.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Himalayan vs Peninsular rivers</title>
  <desc id="d">Two panels contrasting Himalayan rivers (perennial, antecedent, deltas; Indus, Ganga, Brahmaputra) with Peninsular rivers (seasonal; east-flowing Godavari/Krishna/Kaveri/Mahanadi form deltas, west-flowing Narmada/Tapi form estuaries).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Indian drainage — Himalayan vs Peninsular rivers</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Two contrasting river systems</text><rect class="box" x="28" y="92" width="372" height="336" rx="12"/><rect class="box2" x="420" y="92" width="372" height="336" rx="12"/><text class="ink" x="214" y="122" font-size="17" font-weight="700" text-anchor="middle">Himalayan (perennial)</text><text class="ink" x="606" y="122" font-size="17" font-weight="700" text-anchor="middle">Peninsular (mostly seasonal)</text><text class="muted" x="48" y="156" font-size="13.5" text-anchor="start">Snow + rain fed → perennial</text><text class="muted" x="48" y="182" font-size="13.5" text-anchor="start">Antecedent; cut deep gorges</text><text class="muted" x="48" y="208" font-size="13.5" text-anchor="start">Large deltas, meanders, oxbows</text><text class="muted" x="48" y="234" font-size="13.5" text-anchor="start">Indus (Panchnad: Jhelum,</text><text class="muted" x="48" y="260" font-size="13.5" text-anchor="start">  Chenab, Ravi, Beas, Satluj)</text><text class="muted" x="48" y="286" font-size="13.5" text-anchor="start">Ganga (Yamuna, Kosi, Son)</text><text class="muted" x="48" y="312" font-size="13.5" text-anchor="start">Brahmaputra (Tsangpo/Dihang)</text><text class="muted" x="440" y="156" font-size="13.5" text-anchor="start">Rain-fed → seasonal flow</text><text class="muted" x="440" y="182" font-size="13.5" text-anchor="start">Old, graded, shallow valleys</text><text class="muted" x="440" y="208" font-size="13.5" text-anchor="start">East-flowing form deltas:</text><text class="muted" x="440" y="234" font-size="13.5" text-anchor="start">  Godavari (Dakshin Ganga),</text><text class="muted" x="440" y="260" font-size="13.5" text-anchor="start">  Krishna, Kaveri, Mahanadi</text><text class="muted" x="440" y="286" font-size="13.5" text-anchor="start">West-flowing (rift, estuaries):</text><text class="muted" x="440" y="312" font-size="13.5" text-anchor="start">  Narmada, Tapi (no delta)</text>
</svg>
