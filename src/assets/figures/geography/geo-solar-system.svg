<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-solar-system.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">Solar System planet order</title>
  <desc id="d">Planets in order from the Sun: Mercury, Venus, Earth, Mars (terrestrial), Jupiter, Saturn, Uranus, Neptune (Jovian giants). Jupiter is largest.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="392" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">The Solar System — planets in order</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">From the Sun outward (schematic, not to scale)</text><circle class="accent" cx="60" cy="230" r="34"/><text class="ink" x="60" y="300" font-size="14" font-weight="700" text-anchor="middle">Sun</text><circle cx="150" cy="230" r="12" fill="#9ca3af"/><text class="ink" x="150" y="264" font-size="12.5" font-weight="600" text-anchor="middle">Mercury</text><circle cx="232" cy="230" r="18" fill="#d9a441"/><text class="ink" x="232" y="270" font-size="12.5" font-weight="600" text-anchor="middle">Venus</text><circle cx="314" cy="230" r="19" fill="#2563eb"/><text class="ink" x="314" y="271" font-size="12.5" font-weight="600" text-anchor="middle">Earth</text><circle cx="396" cy="230" r="15" fill="#b45309"/><text class="ink" x="396" y="267" font-size="12.5" font-weight="600" text-anchor="middle">Mars</text><circle cx="478" cy="230" r="30" fill="#c8863b"/><text class="ink" x="478" y="282" font-size="12.5" font-weight="600" text-anchor="middle">Jupiter</text><circle cx="560" cy="230" r="26" fill="#d4b483"/><text class="ink" x="560" y="278" font-size="12.5" font-weight="600" text-anchor="middle">Saturn</text><circle cx="642" cy="230" r="22" fill="#5eb3c9"/><text class="ink" x="642" y="274" font-size="12.5" font-weight="600" text-anchor="middle">Uranus</text><circle cx="724" cy="230" r="21" fill="#3b6fd4"/><text class="ink" x="724" y="273" font-size="12.5" font-weight="600" text-anchor="middle">Neptune</text><text class="muted" x="28" y="372" font-size="12.5" text-anchor="start">Terrestrial (rocky): Mercury–Mars · Jovian (gas/ice giants): Jupiter–Neptune. Jupiter is the largest.</text>
</svg>
