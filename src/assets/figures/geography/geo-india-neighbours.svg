<?xml version="1.0" encoding="UTF-8"?>
<!-- geo-india-neighbours.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="t d">
  <title id="t">India land borders by neighbour</title>
  <desc id="d">Horizontal bar chart of India's land-border length with each neighbour: Bangladesh 4096 km, China 3488, Pakistan 3323, Nepal 1751, Myanmar 1643, Bhutan 699, Afghanistan 106.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="452" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">India — land borders by neighbour</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Border length in km (schematic bar chart)</text><text class="ink" x="248" y="118" font-size="14" font-weight="600" text-anchor="end">Bangladesh</text><rect class="bar" x="260" y="96" width="480" height="30" rx="4"/><text class="muted" x="748" y="118" font-size="13" text-anchor="start">4,096 km</text><text class="ink" x="248" y="166" font-size="14" font-weight="600" text-anchor="end">China</text><rect class="bar" x="260" y="144" width="408" height="30" rx="4"/><text class="muted" x="676" y="166" font-size="13" text-anchor="start">3,488 km</text><text class="ink" x="248" y="214" font-size="14" font-weight="600" text-anchor="end">Pakistan</text><rect class="bar" x="260" y="192" width="389" height="30" rx="4"/><text class="muted" x="657" y="214" font-size="13" text-anchor="start">3,323 km</text><text class="ink" x="248" y="262" font-size="14" font-weight="600" text-anchor="end">Nepal</text><rect class="bar" x="260" y="240" width="205" height="30" rx="4"/><text class="muted" x="473" y="262" font-size="13" text-anchor="start">1,751 km</text><text class="ink" x="248" y="310" font-size="14" font-weight="600" text-anchor="end">Myanmar</text><rect class="bar" x="260" y="288" width="192" height="30" rx="4"/><text class="muted" x="460" y="310" font-size="13" text-anchor="start">1,643 km</text><text class="ink" x="248" y="358" font-size="14" font-weight="600" text-anchor="end">Bhutan</text><rect class="bar" x="260" y="336" width="81" height="30" rx="4"/><text class="muted" x="349" y="358" font-size="13" text-anchor="start">699 km</text><text class="ink" x="248" y="406" font-size="14" font-weight="600" text-anchor="end">Afghanistan</text><rect class="bar" x="260" y="384" width="12" height="30" rx="4"/><text class="muted" x="280" y="406" font-size="13" text-anchor="start">106 km</text><text class="muted" x="28" y="430" font-size="13" text-anchor="start">Longest: Bangladesh (4,096) · Shortest: Afghanistan (106).</text>
</svg>
