<?xml version="1.0" encoding="UTF-8"?>
<!-- hist-classical-dances.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
  <title id="t">Classical dances of India</title>
  <desc id="d">Eight classical dances and their states: Bharatanatyam (Tamil Nadu), Kuchipudi (Andhra Pradesh), Kathakali &amp; Mohiniyattam (Kerala), Kathak (UP), Odissi (Odisha), Manipuri (Manipur), Sattriya (Assam).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="492" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Classical dances of India — by state</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Eight forms recognised by the Sangeet Natak Akademi</text><rect class="box" x="28" y="96" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="118" r="7"/><text class="ink" x="72" y="123" font-size="15" font-weight="700" text-anchor="start">Bharatanatyam</text><text class="teal" x="770" y="123" font-size="14" font-weight="600" text-anchor="end">Tamil Nadu</text><rect class="box" x="28" y="146" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="168" r="7"/><text class="ink" x="72" y="173" font-size="15" font-weight="700" text-anchor="start">Kuchipudi</text><text class="teal" x="770" y="173" font-size="14" font-weight="600" text-anchor="end">Andhra Pradesh</text><rect class="box" x="28" y="196" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="218" r="7"/><text class="ink" x="72" y="223" font-size="15" font-weight="700" text-anchor="start">Kathakali</text><text class="teal" x="770" y="223" font-size="14" font-weight="600" text-anchor="end">Kerala</text><rect class="box" x="28" y="246" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="268" r="7"/><text class="ink" x="72" y="273" font-size="15" font-weight="700" text-anchor="start">Mohiniyattam</text><text class="teal" x="770" y="273" font-size="14" font-weight="600" text-anchor="end">Kerala</text><rect class="box" x="28" y="296" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="318" r="7"/><text class="ink" x="72" y="323" font-size="15" font-weight="700" text-anchor="start">Kathak</text><text class="teal" x="770" y="323" font-size="14" font-weight="600" text-anchor="end">Uttar Pradesh (North)</text><rect class="box" x="28" y="346" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="368" r="7"/><text class="ink" x="72" y="373" font-size="15" font-weight="700" text-anchor="start">Odissi</text><text class="teal" x="770" y="373" font-size="14" font-weight="600" text-anchor="end">Odisha</text><rect class="box" x="28" y="396" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="418" r="7"/><text class="ink" x="72" y="423" font-size="15" font-weight="700" text-anchor="start">Manipuri</text><text class="teal" x="770" y="423" font-size="14" font-weight="600" text-anchor="end">Manipur</text><rect class="box" x="28" y="446" width="764" height="44" rx="9"/><circle class="accent" cx="52" cy="468" r="7"/><text class="ink" x="72" y="473" font-size="15" font-weight="700" text-anchor="start">Sattriya</text><text class="teal" x="770" y="473" font-size="14" font-weight="600" text-anchor="end">Assam</text><text class="muted" x="28" y="484" font-size="13" text-anchor="start">Kuchipudi is Andhra Pradesh's classical dance (village Kuchipudi, Krishna dist.).</text>
</svg>
