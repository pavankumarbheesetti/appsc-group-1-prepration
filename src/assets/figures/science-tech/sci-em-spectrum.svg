<?xml version="1.0" encoding="UTF-8"?>
<!-- sci-em-spectrum.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="t d">
  <title id="t">Electromagnetic spectrum</title>
  <desc id="d">EM spectrum from long to short wavelength: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma; energy and frequency rise to the right.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="352" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">The electromagnetic spectrum</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Increasing frequency / energy → right</text><rect x="40" y="150" width="104" height="70" fill="#6b7280" opacity="0.85"/><text class="panel" x="92.0" y="192" font-size="13" font-weight="700" text-anchor="middle">Radio</text><rect x="144" y="150" width="104" height="70" fill="#0f766e" opacity="0.85"/><text class="panel" x="196.0" y="192" font-size="13" font-weight="700" text-anchor="middle">Micro</text><rect x="248" y="150" width="104" height="70" fill="#b45309" opacity="0.85"/><text class="panel" x="300.0" y="192" font-size="13" font-weight="700" text-anchor="middle">Infrared</text><rect x="352" y="150" width="104" height="70" fill="#22c55e" opacity="0.85"/><text class="panel" x="404.0" y="192" font-size="13" font-weight="700" text-anchor="middle">Visible</text><rect x="456" y="150" width="104" height="70" fill="#7c3aed" opacity="0.85"/><text class="panel" x="508.0" y="192" font-size="13" font-weight="700" text-anchor="middle">UV</text><rect x="560" y="150" width="104" height="70" fill="#2563eb" opacity="0.85"/><text class="panel" x="612.0" y="192" font-size="13" font-weight="700" text-anchor="middle">X-ray</text><rect x="664" y="150" width="104" height="70" fill="#dc2626" opacity="0.85"/><text class="panel" x="716.0" y="192" font-size="13" font-weight="700" text-anchor="middle">Gamma</text><text class="muted" x="40" y="140" font-size="12" text-anchor="start">← longer wavelength</text><text class="muted" x="780" y="140" font-size="12" text-anchor="end">shorter wavelength →</text><text class="muted" x="28" y="262" font-size="13" text-anchor="start">Visible light (VIBGYOR) is a tiny band. Wavelength ↓ ⇒ frequency ↑ ⇒ energy ↑.</text><text class="muted" x="28" y="292" font-size="13" text-anchor="start">Order 'Radio-Micro-Infrared-Visible-UV-Xray-Gamma' by rising energy.</text>
</svg>
