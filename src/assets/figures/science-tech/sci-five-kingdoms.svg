<?xml version="1.0" encoding="UTF-8"?>
<!-- sci-five-kingdoms.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Five Kingdoms of Life</title>
  <desc id="d">Whittaker's five kingdoms: Monera (prokaryotes), Protista (single-celled eukaryotes), Fungi (decomposers), Plantae (autotrophs), Animalia (heterotrophs).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Five Kingdoms of Life (Whittaker, 1969)</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Classification of living organisms</text><rect class="box" x="28" y="96" width="764" height="64" rx="10"/><text class="ink" x="44" y="124" font-size="16" font-weight="700" text-anchor="start">Monera</text><text class="muted" x="44" y="146" font-size="13" text-anchor="start">Prokaryotes — bacteria, cyanobacteria (no true nucleus)</text><rect class="box2" x="28" y="168" width="764" height="64" rx="10"/><text class="ink" x="44" y="196" font-size="16" font-weight="700" text-anchor="start">Protista</text><text class="muted" x="44" y="218" font-size="13" text-anchor="start">Single-celled eukaryotes — amoeba, paramecium, algae</text><rect class="box3" x="28" y="240" width="764" height="64" rx="10"/><text class="ink" x="44" y="268" font-size="16" font-weight="700" text-anchor="start">Fungi</text><text class="muted" x="44" y="290" font-size="13" text-anchor="start">Eukaryotic, heterotrophic decomposers — yeast, mushrooms</text><rect class="box2" x="28" y="312" width="764" height="64" rx="10"/><text class="ink" x="44" y="340" font-size="16" font-weight="700" text-anchor="start">Plantae</text><text class="muted" x="44" y="362" font-size="13" text-anchor="start">Multicellular autotrophs — photosynthesis (cellulose walls)</text><rect class="box" x="28" y="384" width="764" height="64" rx="10"/><text class="ink" x="44" y="412" font-size="16" font-weight="700" text-anchor="start">Animalia</text><text class="muted" x="44" y="434" font-size="13" text-anchor="start">Multicellular heterotrophs — no cell wall, mobile</text><text class="muted" x="28" y="456" font-size="12.5" text-anchor="start">Basis: cell type, cell wall, nutrition, body organisation. Viruses are NOT included.</text>
</svg>
