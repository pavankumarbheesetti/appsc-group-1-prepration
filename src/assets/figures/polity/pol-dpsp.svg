<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-dpsp.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Directive Principles classification</title>
  <desc id="d">Three schools of DPSP (Part IV, Art 36-51, non-justiciable): Socialist, Gandhian, and Liberal-Intellectual principles with their key articles.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="412" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Directive Principles of State Policy (Part IV)</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Art 36–51 · non-justiciable · three broad schools</text><rect class="box3" x="34" y="110" width="250" height="250" rx="12"/><text class="ink" x="159.0" y="142" font-size="16" font-weight="700" text-anchor="middle">Socialist</text><text class="muted" x="159.0" y="176" font-size="12.5" text-anchor="middle">Art 38,39,41,42,43,47 —</text><text class="muted" x="159.0" y="196" font-size="12.5" text-anchor="middle">welfare, equal pay, living</text><text class="muted" x="159.0" y="216" font-size="12.5" text-anchor="middle">wage, health</text><rect class="box2" x="292" y="110" width="250" height="250" rx="12"/><text class="ink" x="417.0" y="142" font-size="16" font-weight="700" text-anchor="middle">Gandhian</text><text class="muted" x="417.0" y="176" font-size="12.5" text-anchor="middle">Art 40,43,46,47,48 —</text><text class="muted" x="417.0" y="196" font-size="12.5" text-anchor="middle">panchayats, cottage industry,</text><text class="muted" x="417.0" y="216" font-size="12.5" text-anchor="middle">SC/ST upliftment, cow</text><text class="muted" x="417.0" y="236" font-size="12.5" text-anchor="middle">protection</text><rect class="box" x="550" y="110" width="250" height="250" rx="12"/><text class="ink" x="675.0" y="142" font-size="16" font-weight="700" text-anchor="middle">Liberal–Intellectual</text><text class="muted" x="675.0" y="176" font-size="12.5" text-anchor="middle">Art 44,45,48,49,50,51 — UCC,</text><text class="muted" x="675.0" y="196" font-size="12.5" text-anchor="middle">early childhood care,</text><text class="muted" x="675.0" y="216" font-size="12.5" text-anchor="middle">environment, separation of</text><text class="muted" x="675.0" y="236" font-size="12.5" text-anchor="middle">judiciary, world peace</text><text class="muted" x="28" y="400" font-size="12.5" text-anchor="start">Added by 42nd Amdt: Art 39A, 43A, 48A. DPSP guide the State but courts cannot enforce them.</text>
</svg>
