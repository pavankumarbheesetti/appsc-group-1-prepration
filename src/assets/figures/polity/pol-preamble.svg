<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-preamble.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">Preamble key words</title>
  <desc id="d">Key Preamble words as chips: Sovereign, Socialist and Secular (added by 42nd Amendment), Democratic, Republic; and objectives Justice, Liberty, Equality, Fraternity.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="392" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Preamble to the Constitution</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">The philosophy in key words</text><rect class="box" x="40" y="110" width="230" height="52" rx="26"/><circle class="teal" cx="66" cy="136" r="9"/><text class="ink" x="86" y="142" font-size="15" font-weight="700" text-anchor="start">SOVEREIGN</text><rect class="box" x="290" y="110" width="230" height="52" rx="26"/><circle class="accent" cx="316" cy="136" r="9"/><text class="ink" x="336" y="142" font-size="15" font-weight="700" text-anchor="start">SOCIALIST*</text><rect class="box" x="540" y="110" width="230" height="52" rx="26"/><circle class="accent" cx="566" cy="136" r="9"/><text class="ink" x="586" y="142" font-size="15" font-weight="700" text-anchor="start">SECULAR*</text><rect class="box" x="40" y="176" width="230" height="52" rx="26"/><circle class="teal" cx="66" cy="202" r="9"/><text class="ink" x="86" y="208" font-size="15" font-weight="700" text-anchor="start">DEMOCRATIC</text><rect class="box" x="290" y="176" width="230" height="52" rx="26"/><circle class="teal" cx="316" cy="202" r="9"/><text class="ink" x="336" y="208" font-size="15" font-weight="700" text-anchor="start">REPUBLIC</text><rect class="box" x="540" y="176" width="230" height="52" rx="26"/><circle class="blue" cx="566" cy="202" r="9"/><text class="ink" x="586" y="208" font-size="15" font-weight="700" text-anchor="start">JUSTICE</text><rect class="box" x="40" y="242" width="230" height="52" rx="26"/><circle class="blue" cx="66" cy="268" r="9"/><text class="ink" x="86" y="274" font-size="15" font-weight="700" text-anchor="start">LIBERTY</text><rect class="box" x="290" y="242" width="230" height="52" rx="26"/><circle class="blue" cx="316" cy="268" r="9"/><text class="ink" x="336" y="274" font-size="15" font-weight="700" text-anchor="start">EQUALITY</text><rect class="box" x="540" y="242" width="230" height="52" rx="26"/><circle class="blue" cx="566" cy="268" r="9"/><text class="ink" x="586" y="274" font-size="15" font-weight="700" text-anchor="start">FRATERNITY</text><text class="muted" x="28" y="372" font-size="12.5" text-anchor="start">*'Socialist' &amp; 'Secular' added by the 42nd Amendment (1976). 'We, the People' = source of authority.</text>
</svg>
