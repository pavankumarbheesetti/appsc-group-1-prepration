<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-amendment-process.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Constitutional amendment procedures</title>
  <desc id="d">Article 368: simple majority (outside 368), special majority (most amendments), and special majority plus ratification by half the states (federal provisions). Basic-structure limit from Kesavananda Bharati.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Amending the Constitution — Article 368</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Three procedures by majority required</text><rect class="box" x="28" y="100" width="764" height="98" rx="12"/><text class="ink" x="44" y="132" font-size="16" font-weight="700" text-anchor="start">Simple majority</text><text class="muted" x="44" y="156" font-size="13" text-anchor="start">Outside 368 (e.g. new states, citizenship, salaries)</text><rect class="box2" x="28" y="210" width="764" height="98" rx="12"/><text class="ink" x="44" y="242" font-size="16" font-weight="700" text-anchor="start">Special majority</text><text class="muted" x="44" y="266" font-size="13" text-anchor="start">2/3 of members present &amp; voting + majority of total membership (most amendments;</text><text class="muted" x="44" y="286" font-size="13" text-anchor="start">Part III &amp; IV)</text><rect class="box3" x="28" y="320" width="764" height="98" rx="12"/><text class="ink" x="44" y="352" font-size="16" font-weight="700" text-anchor="start">Special majority + State ratification</text><text class="muted" x="44" y="376" font-size="13" text-anchor="start">Above + ≥ half of State legislatures (federal features: election of President,</text><text class="muted" x="44" y="396" font-size="13" text-anchor="start">Union/State powers, 7th Schedule, Art 368 itself)</text><text class="muted" x="28" y="452" font-size="13" text-anchor="start">Kesavananda Bharati (1973): Parliament cannot alter the 'basic structure'.</text>
</svg>
