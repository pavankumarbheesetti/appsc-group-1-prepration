<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-judiciary.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d">
  <title id="t">Integrated judiciary hierarchy</title>
  <desc id="d">Single integrated hierarchy: Supreme Court (Art 124, writs 32) over High Courts (Art 214, writs 226) over subordinate district/sessions courts.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="422" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Integrated Judiciary of India</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Single hierarchy under the Supreme Court</text><rect class="box3" x="100" y="100" width="620" height="80" rx="12"/><text class="ink" x="410.0" y="132" font-size="17" font-weight="700" text-anchor="middle">Supreme Court</text><text class="muted" x="410.0" y="156" font-size="12" text-anchor="middle">Art 124; CJI + judges; guardian of the Constitution, appeals, writs (32)</text><path class="lead" d="M410 180 L410 200"/><rect class="box2" x="140" y="200" width="540" height="80" rx="12"/><text class="ink" x="410.0" y="232" font-size="17" font-weight="700" text-anchor="middle">High Courts</text><text class="muted" x="410.0" y="256" font-size="12" text-anchor="middle">Art 214; one per State/UT group; writs (226) — wider than SC</text><path class="lead" d="M410 280 L410 300"/><rect class="box" x="180" y="300" width="460" height="80" rx="12"/><text class="ink" x="410.0" y="332" font-size="17" font-weight="700" text-anchor="middle">Subordinate Courts</text><text class="muted" x="410.0" y="356" font-size="12" text-anchor="middle">District &amp; sessions (civil/criminal); under HC supervision</text><text class="muted" x="28" y="410" font-size="13" text-anchor="start">Judicial review lets courts strike down unconstitutional laws/acts.</text>
</svg>
