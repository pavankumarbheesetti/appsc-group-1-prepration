<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-panchayati-raj.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d">
  <title id="t">Panchayati Raj three-tier system</title>
  <desc id="d">73rd Amendment three-tier structure: Zilla Parishad (district), Panchayat Samiti (block), Gram Panchayat (village, with Gram Sabha). Mandatory 5-year term, State Election &amp; Finance Commissions, women and SC/ST reservation.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="432" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Panchayati Raj — three-tier system</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">73rd Amendment (1992), Part IX, Art 243–243O, 11th Schedule</text><rect class="box" x="150" y="110" width="520" height="70" rx="12"/><text class="ink" x="410.0" y="142" font-size="17" font-weight="700" text-anchor="middle">Zilla Parishad</text><text class="muted" x="410.0" y="164" font-size="13" text-anchor="middle">District level</text><path class="lead" d="M410 180 L410 202"/><rect class="box2" x="180" y="202" width="460" height="70" rx="12"/><text class="ink" x="410.0" y="234" font-size="17" font-weight="700" text-anchor="middle">Panchayat Samiti</text><text class="muted" x="410.0" y="256" font-size="13" text-anchor="middle">Block / intermediate level</text><path class="lead" d="M410 272 L410 294"/><rect class="box3" x="210" y="294" width="400" height="70" rx="12"/><text class="ink" x="410.0" y="326" font-size="17" font-weight="700" text-anchor="middle">Gram Panchayat</text><text class="muted" x="410.0" y="348" font-size="13" text-anchor="middle">Village level (Gram Sabha = electorate)</text><text class="muted" x="28" y="410" font-size="12.5" text-anchor="start">Mandatory: 5-yr term, State Election Commission, State Finance Commission, 1/3 seats for women, SC/ST reservation.</text>
</svg>
