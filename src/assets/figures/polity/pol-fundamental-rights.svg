<?xml version="1.0" encoding="UTF-8"?>
<!-- pol-fundamental-rights.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="t d">
  <title id="t">Fundamental Rights categories</title>
  <desc id="d">Six Fundamental Rights: Equality (14-18), Freedom (19-22), against Exploitation (23-24), Freedom of Religion (25-28), Cultural &amp; Educational (29-30), Constitutional Remedies (32).</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="472" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">Fundamental Rights (Part III, Art 12–35)</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">Six categories after 44th Amendment (Right to Property removed)</text><rect class="box" x="28" y="96" width="764" height="58" rx="10"/><text class="ink" x="44" y="120" font-size="15" font-weight="700" text-anchor="start">Right to Equality</text><text class="teal" x="770" y="120" font-size="14" font-weight="700" text-anchor="end">Art 14–18</text><text class="muted" x="44" y="142" font-size="12" text-anchor="start">equality before law, no discrimination, abolition of untouchability/titles</text><rect class="box" x="28" y="159" width="764" height="58" rx="10"/><text class="ink" x="44" y="183" font-size="15" font-weight="700" text-anchor="start">Right to Freedom</text><text class="teal" x="770" y="183" font-size="14" font-weight="700" text-anchor="end">Art 19–22</text><text class="muted" x="44" y="205" font-size="12" text-anchor="start">speech, assembly, movement; life &amp; liberty (21); education (21A)</text><rect class="box" x="28" y="222" width="764" height="58" rx="10"/><text class="ink" x="44" y="246" font-size="15" font-weight="700" text-anchor="start">Right against Exploitation</text><text class="teal" x="770" y="246" font-size="14" font-weight="700" text-anchor="end">Art 23–24</text><text class="muted" x="44" y="268" font-size="12" text-anchor="start">no trafficking/forced labour; no child labour &lt;14 in hazards</text><rect class="box" x="28" y="285" width="764" height="58" rx="10"/><text class="ink" x="44" y="309" font-size="15" font-weight="700" text-anchor="start">Right to Freedom of Religion</text><text class="teal" x="770" y="309" font-size="14" font-weight="700" text-anchor="end">Art 25–28</text><text class="muted" x="44" y="331" font-size="12" text-anchor="start">conscience, propagation, manage religious affairs</text><rect class="box" x="28" y="348" width="764" height="58" rx="10"/><text class="ink" x="44" y="372" font-size="15" font-weight="700" text-anchor="start">Cultural &amp; Educational Rights</text><text class="teal" x="770" y="372" font-size="14" font-weight="700" text-anchor="end">Art 29–30</text><text class="muted" x="44" y="394" font-size="12" text-anchor="start">minorities: protect language/script, run institutions</text><rect class="box" x="28" y="411" width="764" height="58" rx="10"/><text class="ink" x="44" y="435" font-size="15" font-weight="700" text-anchor="start">Right to Constitutional Remedies</text><text class="teal" x="770" y="435" font-size="14" font-weight="700" text-anchor="end">Art 32</text><text class="muted" x="44" y="457" font-size="12" text-anchor="start">Dr Ambedkar's 'heart &amp; soul'; SC writs</text>
</svg>
