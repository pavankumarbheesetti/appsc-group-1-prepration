<?xml version="1.0" encoding="UTF-8"?>
<!-- hist-mahajanapadas.svg - original hand-authored schematic for the APPSC study app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Sixteen Mahajanapadas</title>
  <desc id="d">Grid of the sixteen mahajanapadas (c. 6th century BCE): Kasi, Kosala, Anga, Magadha, Vajji, Malla, Chedi, Vatsa, Kuru, Panchala, Matsya, Surasena, Assaka, Avanti, Gandhara, Kamboja.</desc>
  <style>
    .panel{fill:#f7f3ea;stroke:#d8cdb5}
    .ink{fill:#2b2b2b}
    .muted{fill:#6b7280}
    .box{fill:#eef2f7;stroke:#c9d3e0}
    .box2{fill:#fef3e6;stroke:#e6c79c}
    .box3{fill:#e8f5ee;stroke:#a9d8bf}
    .accent{fill:#b45309;stroke:#7c3f06}
    .teal{fill:#0f766e;stroke:#0c5c55}
    .blue{fill:#2563eb;stroke:#1e40af}
    .river{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;opacity:.85}
    .lead{stroke:#9aa0a6;stroke-width:1;fill:none}
    .bar{fill:#2563eb}
    .bar2{fill:#0f766e}
    .land{fill:#ece3cf;stroke:#c9b78f}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .h{font-weight:700}
    @media (prefers-color-scheme: dark){
      .panel{fill:#1f2530;stroke:#3a4353}
      .ink{fill:#f3f4f6}
      .muted{fill:#aab2bd}
      .box{fill:#2b3342;stroke:#43506a}
      .box2{fill:#3a2f22;stroke:#6b5330}
      .box3{fill:#22352b;stroke:#3f6b52}
      .land{fill:#2b3342;stroke:#43506a}
      .lead{stroke:#5b6675}
    }
  </style>
  <rect class="panel" x="4" y="4" width="812" height="462" rx="16"/>
<text class="ink" x="28" y="42" font-size="22" font-weight="700" text-anchor="start">The Sixteen Mahajanapadas</text><text class="muted" x="28" y="66" font-size="13" text-anchor="start">c. 6th century BCE (per Anguttara Nikaya)</text><rect class="box" x="40" y="100" width="172" height="66" rx="10"/><text class="ink" x="126" y="130" font-size="15" font-weight="700" text-anchor="middle">Kasi</text><rect class="box" x="230" y="100" width="172" height="66" rx="10"/><text class="ink" x="316" y="130" font-size="15" font-weight="700" text-anchor="middle">Kosala</text><rect class="box" x="420" y="100" width="172" height="66" rx="10"/><text class="ink" x="506" y="130" font-size="15" font-weight="700" text-anchor="middle">Anga</text><rect class="box" x="610" y="100" width="172" height="66" rx="10"/><text class="ink" x="696" y="130" font-size="15" font-weight="700" text-anchor="middle">Magadha</text><rect class="box" x="40" y="182" width="172" height="66" rx="10"/><text class="ink" x="126" y="212" font-size="15" font-weight="700" text-anchor="middle">Vajji</text><rect class="box" x="230" y="182" width="172" height="66" rx="10"/><text class="ink" x="316" y="212" font-size="15" font-weight="700" text-anchor="middle">Malla</text><rect class="box" x="420" y="182" width="172" height="66" rx="10"/><text class="ink" x="506" y="212" font-size="15" font-weight="700" text-anchor="middle">Chedi</text><rect class="box" x="610" y="182" width="172" height="66" rx="10"/><text class="ink" x="696" y="212" font-size="15" font-weight="700" text-anchor="middle">Vatsa</text><rect class="box" x="40" y="264" width="172" height="66" rx="10"/><text class="ink" x="126" y="294" font-size="15" font-weight="700" text-anchor="middle">Kuru</text><rect class="box" x="230" y="264" width="172" height="66" rx="10"/><text class="ink" x="316" y="294" font-size="15" font-weight="700" text-anchor="middle">Panchala</text><rect class="box" x="420" y="264" width="172" height="66" rx="10"/><text class="ink" x="506" y="294" font-size="15" font-weight="700" text-anchor="middle">Matsya</text><rect class="box" x="610" y="264" width="172" height="66" rx="10"/><text class="ink" x="696" y="294" font-size="15" font-weight="700" text-anchor="middle">Surasena</text><rect class="box" x="40" y="346" width="172" height="66" rx="10"/><text class="ink" x="126" y="376" font-size="15" font-weight="700" text-anchor="middle">Assaka</text><rect class="box" x="230" y="346" width="172" height="66" rx="10"/><text class="ink" x="316" y="376" font-size="15" font-weight="700" text-anchor="middle">Avanti</text><rect class="box" x="420" y="346" width="172" height="66" rx="10"/><text class="ink" x="506" y="376" font-size="15" font-weight="700" text-anchor="middle">Gandhara</text><rect class="box" x="610" y="346" width="172" height="66" rx="10"/><text class="ink" x="696" y="376" font-size="15" font-weight="700" text-anchor="middle">Kamboja</text><text class="muted" x="28" y="448" font-size="13" text-anchor="start">Magadha emerged supreme; Assaka (on the Godavari) was the only southern mahajanapada.</text>
</svg>
